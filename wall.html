<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Spraycollective — Wall</title>
<!--
  The wall, rebuilt for speed.

  test-wall.html measured 60 fps idle and 24 fps while painting on a Pi 5 at
  720p, and every one of those losses was structural rather than a tuning
  mistake, so they are designed out here rather than optimised away:

    * ONE canvas, and it is never cleared. Strokes are baked in and stay.
      The old build stacked three full-screen canvases and cleared the top one
      every frame to draw a cursor - which forces the compositor to re-upload
      ~3.7 MB per frame. Hiding that one layer doubled the frame rate.
    * The cursor is a DOM element moved with a transform. GPU-composited, no
      texture upload, no canvas involvement. This is why debug-pointer.html
      felt instant while the wall did not.
    * Nothing animates on its own. There is no render loop when idle: the
      canvas is touched only when a pointer moves.
    * Brush stamps are pre-rendered once into a small offscreen canvas and
      blitted. The old brush built radial gradients per stamp and re-drew
      every live stamp for 260 ms, which cost 60 -> 24 fps by itself.
    * The backing store is capped at 1x regardless of devicePixelRatio. On a
      retina Mac that alone is a 4x saving in fill rate.

  UI scale is independent of canvas resolution: --ui scales the chrome without
  touching paint resolution or frame rate. On a 65" TV at 720p the controls
  are physically huge at scale 1; the paint detail is unaffected either way.
-->
<style>
  :root{
    --ui: 1;                    /* chrome scale, independent of render scale */
    --bg: #f4f4f2;
    --btn-bg: rgba(255,255,255,0.92);
    --btn-border: rgba(0,0,0,0.10);
    --fg: #161616;
    --sel: #161616;
    --danger: #e5484d;
    --brand-filter: drop-shadow(0 0 3px rgba(255,255,255,0.85)) drop-shadow(0 0 1px rgba(255,255,255,0.85)) drop-shadow(0 1px 3px rgba(0,0,0,0.18));
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;color:var(--fg);
    -webkit-user-select:none;user-select:none;touch-action:none;}

  #paint{position:fixed;inset:0;display:block;}

  /* Cursors: DOM, not canvas. Moving a transform is compositor-only work. */
  .cursor{
    position:fixed;left:0;top:0;pointer-events:none;border-radius:50%;
    border:2px solid rgba(255,255,255,0.95);box-shadow:0 0 0 2px rgba(0,0,0,0.35);
    will-change:transform;
  }
  .cursor::after{content:'';position:absolute;inset:calc(50% - 2px);border-radius:50%;
    background:rgba(255,255,255,0.95);}

  /* ---- chrome, all sized off --ui ---- */
  .bar{
    position:fixed;z-index:6;display:flex;align-items:center;
    gap:calc(10px * var(--ui));
  }
  #bottom{left:calc(26px * var(--ui));bottom:calc(22px * var(--ui));}
  #top{right:calc(26px * var(--ui));top:calc(20px * var(--ui));}

  .pill{
    display:flex;align-items:center;justify-content:center;position:relative;
    gap:calc(12px * var(--ui));
    height:calc(66px * var(--ui));min-width:calc(66px * var(--ui));
    padding:0 calc(24px * var(--ui));
    border-radius:calc(34px * var(--ui));
    border:1px solid var(--btn-border);background:var(--btn-bg);
    box-shadow:0 4px 14px rgba(0,0,0,0.10);
    font-weight:600;font-size:calc(19px * var(--ui));cursor:pointer;
  }
  .pill.icon{padding:0;width:calc(66px * var(--ui));}
  .pill svg{width:calc(24px * var(--ui));height:calc(24px * var(--ui));}

  /* The dwell ring: fills while a can rests on a control. */
  .pill::after{
    content:'';position:absolute;inset:calc(-6px * var(--ui));border-radius:inherit;
    pointer-events:none;opacity:0;
    background:conic-gradient(var(--sel) calc(var(--arm,0) * 1turn),transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
    mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
  }
  .pill.arming::after{opacity:1;}
  .pill.danger.arming::after{background:conic-gradient(var(--danger) calc(var(--arm,0) * 1turn),transparent 0);}

  .sw{width:calc(42px * var(--ui));height:calc(42px * var(--ui));border-radius:50%;
    outline:calc(3px * var(--ui)) solid transparent;outline-offset:calc(3px * var(--ui));}
  .sw.on{outline-color:var(--sel);}
  .dot{border-radius:50%;background:var(--fg);opacity:0.28;}
  .dot.on{opacity:1;outline:calc(3px * var(--ui)) solid var(--sel);
    outline-offset:calc(3px * var(--ui));}

  /* ---- big menu: the can's only fine control is where it points ---- */
  #menu{
    position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #menu.show{display:flex;}
  #menu-row{display:flex;gap:calc(34px * var(--ui));align-items:center;}
  .mi{
    min-width:calc(168px * var(--ui));height:calc(168px * var(--ui));
    border-radius:calc(84px * var(--ui));
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    outline:calc(5px * var(--ui)) solid transparent;outline-offset:calc(10px * var(--ui));
    box-shadow:0 6px 22px rgba(0,0,0,0.35);
    transition:transform .12s ease,outline-color .12s ease;
  }
  .mi.on{transform:scale(1.14);outline-color:#fff;}
  .mi.size{background:#fff;}
  .mi.mode{background:#fff;color:#161616;border-radius:calc(34px * var(--ui));
    padding:0 calc(34px * var(--ui));font-weight:700;font-size:calc(27px * var(--ui));
    text-align:center;line-height:1.15;}
  .hint{position:absolute;bottom:12%;color:#fff;opacity:.92;
    font-weight:600;font-size:calc(15px * var(--ui));}

  /* ---- calibration ---- */
  #cal{position:fixed;inset:0;z-index:50;display:none;background:#111;color:#fff;}
  #cal.show{display:block;}
  #cal .target{position:fixed;width:calc(120px * var(--ui));height:calc(120px * var(--ui));
    margin:calc(-60px * var(--ui)) 0 0 calc(-60px * var(--ui));
    border-radius:50%;border:calc(4px * var(--ui)) solid #fff;opacity:.25;}
  #cal .target.on{opacity:1;box-shadow:0 0 0 calc(8px * var(--ui)) rgba(255,255,255,.18);}
  #cal .msg{position:fixed;left:0;right:0;top:46%;text-align:center;
    font-weight:600;font-size:calc(22px * var(--ui));}
  #cal .sub{position:fixed;left:0;right:0;top:53%;text-align:center;opacity:.7;
    font-size:calc(15px * var(--ui));}
  #cal .skip{position:fixed;left:0;right:0;bottom:calc(26px * var(--ui));text-align:center;
    opacity:.4;font-size:calc(13px * var(--ui));}

  /* Brand marks. Static SVG, no animation, no per-frame cost - and the filter
     flips on dark themes so the logo stays legible on the Space background. */
  .brand{position:fixed;left:calc(26px * var(--ui));top:calc(20px * var(--ui));z-index:7;
    pointer-events:none;filter:var(--brand-filter);}
  .brand svg{display:block;height:calc(19px * var(--ui));width:auto;}
  .brand.invent{top:auto;left:auto;bottom:calc(24px * var(--ui));right:calc(26px * var(--ui));
    pointer-events:auto;cursor:pointer;border-radius:calc(20px * var(--ui));
    padding:calc(6px * var(--ui));}
  .brand.invent::after{
    content:'';position:absolute;inset:calc(-6px * var(--ui));border-radius:inherit;
    pointer-events:none;opacity:0;
    background:conic-gradient(var(--sel) calc(var(--arm,0) * 1turn),transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
    mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 0);
  }
  .brand.invent.arming::after{opacity:1;}
  .brand.invent svg{height:calc(18.7px * var(--ui));}
  #status{position:fixed;left:calc(26px * var(--ui));top:calc(52px * var(--ui));z-index:6;
    font-size:calc(13px * var(--ui));opacity:.55;}
</style>
</head>

<div id="cursors"></div>

<script>
'use strict';

/* ------------------------------------------------------------------ config */
const SIZES = [0.6, 0.85, 1.1, 1.45, 1.8];

/* ------------------------------------------------------------------ themes
   Each theme is a plain object: a palette, a background, and a paint()
   that draws one segment straight into the persistent canvas.

   ISOLATION: no theme registers a timer, a frame callback or a layer, and
   none keeps anything alive to redraw later. An inactive theme is an object
   nobody holds a reference to; it cannot cost anything. Even the active one
   costs nothing while you are not painting. That is the whole reason the old
   build's Space sky and Blobs wriggle are not here: both re-rendered every
   frame whether or not you were using them.

   Stamps are pre-rendered per theme+colour+kind and blitted. Building a
   gradient per stamp is what made the old brush cost 25 ms a frame. */
const stampCache = new Map();
function makeStamp(key, build) {
  let c = stampCache.get(key);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = c.height = 128;
  build(c.getContext('2d'), 64);
  stampCache.set(key, c);
  return c;
}
const hex = (c, a) => {
  const n = parseInt(c.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
};
// Walk a segment at a spacing tied to the radius, so a fast hand still leaves
// a continuous line rather than a dotted one.
function along(x0, y0, x1, y1, step, fn) {
  const dx = x1 - x0, dy = y1 - y0;
  const n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / step));
  for (let i = 1; i <= n; i++) fn(x0 + dx * i / n, y0 + dy * i / n, i / n);
}

function frogStamp(color) {
  const key = 'frog' + color;
  let c = stampCache.get(key);
  if (c) return c;
  if (!frogReady) return null;                 // not decoded yet; skip this stamp
  c = document.createElement('canvas');
  c.width = FROG_W; c.height = FROG_H;
  const g = c.getContext('2d');
  g.drawImage(frogImg, 0, 0, FROG_W, FROG_H);
  g.globalCompositeOperation = 'source-in';    // recolour the silhouette
  g.fillStyle = color;

  stampCache.set(key, c);
  return c;
}

          ctx.globalAlpha = 0.5 + Math.random() * 0.4;
          ctx.drawImage(img, x + Math.cos(a) * d - fr, y + Math.sin(a) * d - fr, fr * 2, fr * 2);
        }
      });
      ctx.globalAlpha = 1;
    },
  },

  spray: {
    label: 'Spray Brush',
    bg: '#ffffff',
    colors: ['#FF6B3D', '#F2E64B', '#E068B4', '#0077D4'],
    radius: s => 17 * s,
    drip: { chance: 0.03, len: [40, 160], w: 0.24, alpha: 0.55, speed: 2.6 },
    paint(ctx, x0, y0, x1, y1, r, color) {
      // A faint haze plus hard speckles. The speckles are what make it read as
      // aerosol rather than airbrush, and small filled arcs are cheap - it is
      // the per-stamp GRADIENTS that were expensive, and that one is cached.
      const haze = makeStamp('haze' + color, (g, R) => {
        const grad = g.createRadialGradient(R, R, 0, R, R, R);
        grad.addColorStop(0, hex(color, 0.16)); grad.addColorStop(0.6, hex(color, 0.07));
        grad.addColorStop(1, hex(color, 0));
        g.fillStyle = grad; g.beginPath(); g.arc(R, R, R, 0, 6.2832); g.fill();
      });
      along(x0, y0, x1, y1, Math.max(2, r * 0.4), (x, y) => {
        const R = r * 1.6;
        ctx.drawImage(haze, x - R, y - R, R * 2, R * 2);
        const count = 10 + (Math.random() * 8 | 0);
        for (let i = 0; i < count; i++) {
          const a = Math.random() * 6.2832;
          const rr = Math.pow(Math.random(), 1.6) * r * 1.9;   // biased inwards
          const fall = 1 - Math.min(1, rr / (r * 1.9));
          ctx.fillStyle = hex(color, Math.min(0.95, (0.25 + Math.random() * 0.6) * (0.35 + fall * 0.8)));
          ctx.beginPath();
          ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr,
                  Math.max(0.4, (0.5 + Math.random() * 1.7) * (0.5 + fall)), 0, 6.2832);
          ctx.fill();
        }
      });
    },
  },

  space: {
    label: 'Space',
    bg: '#07070f',
    dark: true,
    colors: ['#7fd8ff', '#ffb066', '#ff7ad9', '#c9f56b'],
    radius: s => 20 * s,
    drip: null,                 // paint does not run in zero gravity
    // The old Space theme animated a sky every frame, for every user, whether
    // or not it was the active theme. The stars are painted ONCE here instead:
    // the same look, and nothing to redraw.
    enter(ctx, w, h) {
      for (let i = 0; i < Math.round(w * h / 5200); i++) {
        const x = Math.random() * w, y = Math.random() * h;
        const r = Math.random() < 0.92 ? Math.random() * 1.1 + 0.3 : Math.random() * 2 + 1.2;
        ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.6})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      }
      for (let i = 0; i < 3; i++) {                    // faint nebulae
        const x = Math.random() * w, y = Math.random() * h, R = Math.min(w, h) * (0.25 + Math.random() * 0.3);
        const c = ['#3a2a6a', '#22405f', '#4a2350'][i % 3];
        const g = ctx.createRadialGradient(x, y, 0, x, y, R);
        g.addColorStop(0, hex(c, 0.5)); g.addColorStop(1, hex(c, 0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.2832); ctx.fill();
      }
    },
    paint(ctx, x0, y0, x1, y1, r, color) {
      const img = makeStamp('glow' + color, (g, R) => {
        const grad = g.createRadialGradient(R, R, 0, R, R, R);
        grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.25, color);
        grad.addColorStop(1, hex(color, 0));
        g.fillStyle = grad; g.beginPath(); g.arc(R, R, R, 0, 6.2832); g.fill();
      });
      ctx.globalCompositeOperation = 'lighter';        // light adds, in space
      ctx.globalAlpha = 0.22;
      along(x0, y0, x1, y1, Math.max(2, r * 0.3), (x, y) => {
        ctx.drawImage(img, x - r, y - r, r * 2, r * 2);
        if (Math.random() < 0.3) {
          const a = Math.random() * 6.2832, d = r * (1 + Math.random() * 1.6);
          const fr = r * (0.1 + Math.random() * 0.22);
          ctx.drawImage(img, x + Math.cos(a) * d - fr, y + Math.sin(a) * d - fr, fr * 2, fr * 2);
        }
      });
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    },
  },
};
// Not in THEME_ORDER: Friedolin is reached from the frog, not the mode pill.
THEMES.friedolin = {
  label: 'Friedolin',
  bg: '#f4f4f2',
  colors: ['#2f9e44', '#141210', '#e84a8a', '#1e88e5'],
  radius: s => 34 * s,
  minStep: 2.6,               // frogs must not overlap; see move()
  drip: { chance: 0.02, len: [20, 90], w: 0.12, alpha: 0.5, speed: 2.0 },
  paint(ctx, x0, y0, x1, y1, r, color) {
    const img = frogStamp(color);
    if (!img) return;
    // Spaced well apart and turned a little each time: overlapping frogs read
    // as a smear, separated ones read as a stencil repeated down the wall.
    // Spacing must exceed the stamp width or they merge into a smear: the
    // stamp is r * 2.2 across, so step wider than that.
    along(x0, y0, x1, y1, r * 2.6, (x, y) => {
      const w = r * 2.2 * (0.85 + Math.random() * 0.3);
      const h = w * FROG_H / FROG_W;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate((Math.random() - 0.5) * 0.5);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(img, -w / 2, -h / 2, w, h);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  },
};

const THEME_ORDER = ['simple', 'ink', 'spray', 'space'];
// Cap the backing store at 1x. The Pi is 1x anyway; a retina Mac would
// otherwise render four times the pixels for no visible gain on spray paint.
const RENDER_SCALE = 1;
const DWELL_MENU = 900;      // ms resting on a control before its menu opens
const DWELL_CLEAR = 1800;    // clear wipes the wall, so it wants a real hold
const STALE_MS = 300;        // no fix for this long = pen up

/* -------------------------------------------------------------- homography */
function solveHomography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [X, Y] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -X * x, -X * y]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -Y * x, -Y * y]); b.push(Y);
  }
  for (let c = 0; c < 8; c++) {
    let piv = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-9) return null;        // collinear
    [A[c], A[piv]] = [A[piv], A[c]];
    [b[c], b[piv]] = [b[piv], b[c]];
    for (let r = 0; r < 8; r++) {
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  const h = b.map((v, i) => v / A[i][i]);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
}
function applyHomography(H, x, y) {
  const w = H[6] * x + H[7] * y + H[8];
  if (Math.abs(w) < 1e-9) return null;
  return { x: (H[0] * x + H[1] * y + H[2]) / w, y: (H[3] * x + H[4] * y + H[5]) / w };
}

/* ----------------------------------------------------------------- tracker */
// Multiple spots, one per can. Ids come from the tracker, which matches spots
// between frames; when two cans cross the ids swap, which is invisible while
// everyone paints with the same brush.
class Tracker {
  constructor() {
    this.blobs = []; this.at = 0; this.state = 'idle';
    this.homography = null; this.url = ''; this.onstate = null;
  }
  get calibrated() { return !!this.homography; }

  connect(url) {
    this.disconnect();
    this.url = url; this.want = true; this.open();
  }
  open() {
    this.set('connecting');
    try { this.ws = new WebSocket(this.url); }
    catch (e) { this.set('error'); return this.retry(); }
    this.ws.onopen = () => this.set('live');
    this.ws.onclose = () => { if (this.want) { this.blobs = []; this.set('error'); this.retry(); } };
    this.ws.onerror = () => this.set('error');
    this.ws.onmessage = ev => this.handle(ev.data);
  }
  // The Pi restarts its tracker on failure, so the socket comes back on its
  // own; a page that gave up would need someone to notice from across a room.
  retry() { clearTimeout(this.t); if (this.want) this.t = setTimeout(() => this.open(), 1500); }
  disconnect() {
    this.want = false; clearTimeout(this.t);
    if (this.ws) { const w = this.ws; this.ws = null; try { w.close(); } catch (e) {} }
    this.blobs = []; this.set('idle');
  }
  set(s) { this.state = s; if (this.onstate) this.onstate(s); }

  handle(raw) {
    let m; try { m = JSON.parse(raw); } catch (e) { return; }
    if (m.lost || typeof m.x !== 'number') { this.blobs = []; return; }
    this.blobs = (m.blobs && m.blobs.length ? m.blobs : [{ id: 0, x: m.x, y: m.y, area: m.area }])
      .map(b => ({ id: b.id | 0, x: b.x, y: b.y, area: b.area || 0 }));
    this.at = performance.now();
  }
  // A dead feed must lift the pen, not freeze the cursor where it was - that
  // would paint a permanent blob if the Pi went away mid-stroke.
  raw() {
    if (!this.blobs.length) return [];
    if (performance.now() - this.at > STALE_MS) { this.blobs = []; return []; }
    return this.blobs;
  }
  screen(w, h) {
    if (!this.homography) return [];
    const out = [], m = 0.15;
    for (const b of this.raw()) {
      const p = applyHomography(this.homography, b.x, b.y);
      if (!p || p.x < -m || p.x > 1 + m || p.y < -m || p.y > 1 + m) continue;
      out.push({ id: b.id, x: p.x * w, y: p.y * h });
    }
    return out;
  }
}

/* Hidden behind the frog: things an operator needs and a visitor should not
   stumble into. Reached by clicking it, or by resting a can on it like any
   other control. */
const SECRET = [
  { label: 'Calibrate', run: w => w.beginCalibration() },
  { label: 'Reload',    run: () => location.reload() },
  { label: 'Friedolin', run: w => w.setTheme('friedolin') },
];

/* --------------------------------------------------------------------- app */
class Wall {
  constructor() {
    this.canvas = document.getElementById('paint');
    this.ctx = this.canvas.getContext('2d', { alpha: false });
    this.tracker = new Tracker();
    this.pointers = new Map();     // id -> {x, y}
    this.cursors = new Map();      // id -> element
    this.color = 0; this.size = 2;
    this.themeId = localStorage.getItem('theme') || 'simple';
    if (!THEMES[this.themeId]) this.themeId = 'simple';
    this.theme = THEMES[this.themeId];
    this.dwell = 0; this.dwellOn = null; this.fired = false;
    this.drips = [];
    this.menu = null;
    this.lastT = 0;

    this.resize();
    addEventListener('resize', () => this.resize());
    this.applyTheme(true);
    this.buildControls();
    this.wireMouse();
    this.setUiScale(+(localStorage.getItem('uiScale') || 1) || 1);

    // Report what is true, not what is hoped: an earlier version said
    // "calibrating…" whenever it was merely uncalibrated, so a wall that had
    // never started calibrating claimed it was busy doing so.
    this.tracker.onstate = s => {
      if (s === 'live') {
        this.status(this.tracker.calibrated ? '' : 'connected — starting calibration…');
        // The homography lives in the page, so every reload needs it redone.
        // Start it here rather than relying on an external tool to remember.
        // calibDismissed: someone pressed Escape. Without it, a reconnect - and
        // the tracker reconnects by itself - would drag them straight back into
        // a calibration they had just declined.
        if (!this.tracker.calibrated && !this.calib && !this.calibDismissed) setTimeout(() => {
          if (this.tracker.state === 'live' && !this.tracker.calibrated
              && !this.calib && !this.calibDismissed) this.beginCalibration();
        }, 600);
      } else {
        this.status(s === 'connecting' ? 'connecting…'
                  : s === 'error' ? 'tracker lost — retrying…' : '');
      }
    };

    // Nothing runs when idle. The loop only exists while the tracker is live.
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }

  /* ---- canvas ---- */
  resize() {
    const w = Math.round(innerWidth * RENDER_SCALE), h = Math.round(innerHeight * RENDER_SCALE);
    if (this.canvas.width === w && this.canvas.height === h) return;
    // Preserve what is painted: the canvas is the document, and resizing it
    // would otherwise wipe the wall.
    let keep = null;
    if (this.canvas.width) {
      keep = document.createElement('canvas');
      keep.width = this.canvas.width; keep.height = this.canvas.height;
      keep.getContext('2d').drawImage(this.canvas, 0, 0);
    }
    this.canvas.width = w; this.canvas.height = h;
    this.canvas.style.width = innerWidth + 'px';
    this.canvas.style.height = innerHeight + 'px';
    this.ctx.fillStyle = (this.theme && this.theme.bg) || '#f4f4f2';
    this.ctx.fillRect(0, 0, w, h);
    if (keep) this.ctx.drawImage(keep, 0, 0, w, h);
    this.vw = w; this.vh = h;
  }
  clear() {
    this.ctx.fillStyle = this.theme.bg;
    this.drips.length = 0;
    this.ctx.fillRect(0, 0, this.vw, this.vh);
    if (this.theme.enter) this.theme.enter(this.ctx, this.vw, this.vh);
  }
  toCanvas(x, y) { return { x: x * RENDER_SCALE, y: y * RENDER_SCALE }; }

  /* ---- ui scale, independent of render resolution ---- */
  setUiScale(v) {
    this.uiScale = Math.min(2, Math.max(0.4, v));
    document.documentElement.style.setProperty('--ui', this.uiScale);
    try { localStorage.setItem('uiScale', String(this.uiScale)); } catch (e) {}
  }

  // Switching wipes the wall, as it did before: the background changes, and a
  // stroke made in one palette has no meaning in another.
  applyTheme(initial) {
    this.theme = THEMES[this.themeId];
    const R = document.documentElement.style;
    R.setProperty('--bg', this.theme.bg);
    R.setProperty('--fg', this.theme.dark ? '#f2f2f2' : '#161616');
    R.setProperty('--sel', this.theme.dark ? '#ffffff' : '#161616');
    R.setProperty('--btn-bg', this.theme.dark ? 'rgba(28,28,36,0.92)' : 'rgba(255,255,255,0.92)');
    R.setProperty('--btn-border', this.theme.dark ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.10)');
    R.setProperty('--brand-filter', this.theme.dark
      ? 'invert(1) drop-shadow(0 0 3px rgba(0,0,0,0.85)) drop-shadow(0 0 1px rgba(0,0,0,0.85)) drop-shadow(0 1px 3px rgba(255,255,255,0.18))'
      : 'drop-shadow(0 0 3px rgba(255,255,255,0.85)) drop-shadow(0 0 1px rgba(255,255,255,0.85)) drop-shadow(0 1px 3px rgba(0,0,0,0.18))');
    this.color = 0;
    this.clear();
    try { localStorage.setItem('theme', this.themeId); } catch (e) {}
    if (!initial) this.buildControls();
  }
  setTheme(id) { if (THEMES[id]) { this.themeId = id; this.applyTheme(false); } }
  radius() { return this.theme.radius(SIZES[this.size]); }

  status(msg) { document.getElementById('status').textContent = msg || ''; }

  /* ---- controls ---- */
  buildControls() {
    const cw = document.getElementById('colors');
    cw.innerHTML = '';
    this.theme.colors.forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'sw' + (i === this.color ? ' on' : '');
      d.style.background = c;
      cw.appendChild(d);
    });
    document.getElementById('mode-label').textContent = this.theme.label;
    const sw = document.getElementById('sizes');
    sw.innerHTML = '';
    SIZES.forEach((v, i) => {
      const d = document.createElement('i');
      d.className = 'dot' + (i === this.size ? ' on' : '');
      const px = 7 + v * 13;
      d.style.width = `calc(${px}px * var(--ui))`;
      d.style.height = `calc(${px}px * var(--ui))`;
      sw.appendChild(d);
    });
  }
  setColor(i) { this.color = i; this.buildControls(); }
  setSize(i) { this.size = i; this.buildControls(); }

  targets() {
    return [['color', 'colors'], ['mode', 'mode'], ['size', 'sizes'],
            ['clear', 'clear'], ['secret', 'frog']];
  }
  targetAt(x, y) {
    const pad = 46 * this.uiScale;
    for (const [kind, id] of this.targets()) {
      const el = document.getElementById(id);
      if (!el) continue;
      const r = el.getBoundingClientRect();
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad)
        return { kind, el };
    }
    return null;
  }
  arm(frac, el) {
    for (const [, id] of this.targets()) {
      const t = document.getElementById(id);
      if (!t) continue;
      const on = frac > 0 && t === el;
      t.classList.toggle('arming', on);
      t.style.setProperty('--arm', on ? Math.min(1, frac).toFixed(3) : '0');
    }
  }

  /* ---- big menu ---- */
  openMenu(kind) {
    const row = document.getElementById('menu-row');
    row.innerHTML = '';
    const items = kind === 'secret' ? SECRET.map(a => ({ text: a.label }))
      : kind === 'color' ? this.theme.colors.map(c => ({ bg: c }))
      : kind === 'mode' ? THEME_ORDER.map(id => ({ text: THEMES[id].label }))
      : SIZES.map(v => ({ size: Math.round(14 + v * 46) }));
    items.forEach((it, i) => {
      const d = document.createElement('div');
      d.className = 'mi' + (it.size ? ' size' : '') + (it.text ? ' mode' : '');
      if (it.bg) d.style.background = it.bg;
      if (it.text) d.textContent = it.text;
      if (it.size) {
        const dot = document.createElement('i');
        dot.className = 'dot on';
        dot.style.opacity = 1; dot.style.outline = 'none';
        dot.style.width = `calc(${it.size}px * var(--ui))`;
        dot.style.height = `calc(${it.size}px * var(--ui))`;
        d.appendChild(dot);
      }
      d.addEventListener('mouseenter', () => this.highlight(i));
      d.addEventListener('click', e => { e.stopPropagation(); this.pick(i); });
      row.appendChild(d);
    });
    const back = document.getElementById('menu');
    back.classList.add('show');
    back.onclick = () => this.closeMenu(false);
    this.menu = { kind, index: kind === 'color' ? this.color
                  : kind === 'mode' ? Math.max(0, THEME_ORDER.indexOf(this.themeId))
                  : kind === 'secret' ? 0 : this.size };
    this.highlight(this.menu.index);
  }
  highlight(i) {
    if (!this.menu) return;
    this.menu.index = i;
    [...document.querySelectorAll('#menu-row .mi')]
      .forEach((el, n) => el.classList.toggle('on', n === i));
  }
  // Nearest centre, not a hit test: forgiving of jitter, and there is always
  // exactly one selection rather than dead space between targets.
  aimMenu(x, y) {
    const items = [...document.querySelectorAll('#menu-row .mi')];
    let best = 0, bd = Infinity;
    items.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2);
      const d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    });
    this.highlight(best);
  }
  pick(i) { this.highlight(i); this.closeMenu(true); }
  closeMenu(commit) {
    if (commit && this.menu) {
      const k = this.menu.kind, i = this.menu.index;
      if (k === 'color') this.setColor(i);
      else if (k === 'mode') this.setTheme(THEME_ORDER[i]);
      else if (k === 'secret') { const a = SECRET[i]; this.menu = null; a.run(this); return this.closeMenuDom(); }
      else this.setSize(i);
    }
    this.closeMenuDom();
  }
  closeMenuDom() {
    document.getElementById('menu').classList.remove('show');
    this.menu = null; this.dwell = 0; this.dwellOn = null; this.fired = false;
    this.arm(0, null);
  }

  /* ---- cursors ---- */
  cursor(id, x, y) {
    let el = this.cursors.get(id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'cursor';
      document.getElementById('cursors').appendChild(el);
      this.cursors.set(id, el);
    }
    const d = Math.round(this.radius() * 2 / RENDER_SCALE) + 8;
    el.style.width = d + 'px'; el.style.height = d + 'px';
    el.style.transform = `translate3d(${x - d / 2}px, ${y - d / 2}px, 0)`;
  }
  dropCursor(id) {
    const el = this.cursors.get(id);
    if (el) { el.remove(); this.cursors.delete(id); }
  }

  /* ---- painting ---- */
  down(id, x, y) {
    const p = this.toCanvas(x, y);
    this.pointers.set(id, p);
    this.theme.paint(this.ctx, p.x, p.y, p.x, p.y, this.radius(), this.theme.colors[this.color]);
  }
  move(id, x, y) {
    const p = this.toCanvas(x, y), prev = this.pointers.get(id);
    if (!prev) return this.down(id, x, y);
    // A theme can demand a minimum gap between stamps. along() always places
    // at least one stamp per segment, so without this a theme's spacing is set
    // by how often input arrives rather than by distance - and Friedolin's
    // frogs merged into a smear whenever the pointer reported frequently.
    const min = (this.theme.minStep || 0) * this.radius();
    if (min && Math.hypot(p.x - prev.x, p.y - prev.y) < min) return;
    this.theme.paint(this.ctx, prev.x, prev.y, p.x, p.y, this.radius(), this.theme.colors[this.color]);
    this.pointers.set(id, p);
    this.maybeDrip(p.x, p.y);
  }

  // A drip GROWS - it never moves - so it can be drawn straight into the
  // persistent canvas a few pixels at a time and never needs erasing. That is
  // what makes it affordable here: the old version redrew every live drip onto
  // a cleared overlay every frame.
  maybeDrip(x, y) {
    const d = this.theme.drip;
    if (!d || this.drips.length >= 40 || Math.random() > d.chance) return;
    const r = this.radius();
    this.drips.push({
      x, y, len: 0,
      target: d.len[0] + Math.random() * (d.len[1] - d.len[0]),
      w: r * d.w * (0.7 + Math.random() * 0.6),
      speed: d.speed * (0.7 + Math.random() * 0.7),
      color: this.theme.colors[this.color],
      alpha: d.alpha, blend: d.blend || 'source-over',
    });
  }
  growDrips() {
    const ctx = this.ctx;
    for (let i = this.drips.length - 1; i >= 0; i--) {
      const d = this.drips[i];
      // Its own stamp rather than borrowing a theme's: the cache keys differ
      // per theme (spray's is 'haze'), and a wrong key silently builds an
      // EMPTY canvas and caches it, so the drips would simply never appear.
      const img = makeStamp('drip' + d.color, (g, R) => {
        const grad = g.createRadialGradient(R, R, 0, R, R, R);
        grad.addColorStop(0, d.color); grad.addColorStop(0.6, d.color);
        grad.addColorStop(1, hex(d.color, 0));
        g.fillStyle = grad; g.beginPath(); g.arc(R, R, R, 0, 6.2832); g.fill();
      });
      const step = d.speed;
      ctx.globalCompositeOperation = d.blend;
      // Taper as it runs out of paint, which is what stops it looking like a
      // drawn line and starts it looking like gravity.
      const t = d.len / d.target;
      const w = d.w * (1 - t * 0.55);
      ctx.globalAlpha = d.alpha * (1 - t * 0.5);
      ctx.drawImage(img, d.x - w, d.y + d.len - w, w * 2, w * 2);
      d.len += step;
      if (d.len >= d.target) this.drips.splice(i, 1);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  up(id) { this.pointers.delete(id); }

  /* ---- input: cans ---- */
  loop(t) {
    requestAnimationFrame(this.loop);
    const dt = this.lastT ? t - this.lastT : 0;
    this.lastT = t;
    // One length check per frame when there are none: an empty effect costs
    // nothing, which is the rule the whole build is held to.
    if (this.drips.length) this.growDrips();
    if (this.calib) return this.calibStep();
    if (!this.tracker.calibrated) return;

    const list = this.tracker.screen(innerWidth, innerHeight);
    const seen = new Set(list.map(b => b.id));
    for (const id of [...this.pointers.keys()])
      if (typeof id === 'number' && !seen.has(id)) { this.up(id); this.dropCursor(id); }
    for (const id of [...this.cursors.keys()])
      if (typeof id === 'number' && !seen.has(id)) this.dropCursor(id);

    if (!list.length) {
      if (this.menu) this.closeMenu(true);          // release = commit
      if (this.dwell || this.fired) { this.dwell = 0; this.dwellOn = null; this.fired = false; this.arm(0, null); }
      return;
    }

    let primary = null;
    for (const b of list) {
      this.cursor(b.id, b.x, b.y);
      const over = this.targetAt(b.x, b.y);
      if (this.menu || over) this.up(b.id);        // never spray the controls
      else if (this.pointers.has(b.id)) this.move(b.id, b.x, b.y);
      else this.down(b.id, b.x, b.y);
      if (!primary) primary = { x: b.x, y: b.y, over };
    }

    if (this.menu) return this.aimMenu(primary.x, primary.y);

    // Only the first can drives the menus: two people arming the same control
    // has no meaning, and whoever is not driving should keep painting.
    const over = primary.over;
    if (!over) {
      if (this.dwell || this.fired) { this.dwell = 0; this.dwellOn = null; this.fired = false; this.arm(0, null); }
      return;
    }
    if (over.kind !== this.dwellOn) { this.dwellOn = over.kind; this.dwell = 0; this.fired = false; }
    this.dwell += dt;
    const need = over.kind === 'clear' ? DWELL_CLEAR : DWELL_MENU;
    this.arm(this.dwell / need, over.el);
    if (this.dwell >= need && !this.fired) {
      this.fired = true;                            // leave and return to repeat
      if (over.kind === 'clear') { this.clear(); this.arm(0, null); }
      else this.openMenu(over.kind);
    }
  }

  /* ---- input: mouse and touch, for setting up ---- */
  wireMouse() {
    const c = this.canvas;
    const pos = e => ({ x: e.clientX, y: e.clientY });
    c.addEventListener('pointerdown', e => {
      if (this.menu) return;
      c.setPointerCapture(e.pointerId);
      const p = pos(e); this.down('m' + e.pointerId, p.x, p.y);
    });
    c.addEventListener('pointermove', e => {
      const p = pos(e);
      this.cursor('m' + e.pointerId, p.x, p.y);
      if (this.pointers.has('m' + e.pointerId)) this.move('m' + e.pointerId, p.x, p.y);
    });
    const end = e => { this.up('m' + e.pointerId); this.dropCursor('m' + e.pointerId); };
    c.addEventListener('pointerup', end);
    c.addEventListener('pointercancel', end);
    document.getElementById('colors').addEventListener('click', () => this.openMenu('color'));
    document.getElementById('mode').addEventListener('click', () => this.openMenu('mode'));
    document.getElementById('sizes').addEventListener('click', () => this.openMenu('size'));
    document.getElementById('clear').addEventListener('click', () => this.clear());
    document.getElementById('frog').addEventListener('click', e => {
      e.stopPropagation(); this.openMenu('secret');
    });
    addEventListener('keydown', e => {
      if (e.key === 'Escape') { this.cancelCalibration(); this.closeMenu(false); }
      else if (e.key === 'c') this.beginCalibration();
      else if (e.key === '+' || e.key === '=') this.setUiScale(this.uiScale + 0.1);
      else if (e.key === '-') this.setUiScale(this.uiScale - 0.1);
      else if (e.key === 'Backspace') this.clear();
    });
  }

  /* ---- calibration ---- */
  // The homography lives in the page, so a reload always needs this redone.
  cancelCalibration() {
    if (!this.calib) return;
    document.getElementById('cal').classList.remove('show');
    this.calib = null;
    this.calibDismissed = true;
    this.status('calibration skipped — mouse still paints, press c to calibrate');
    setTimeout(() => this.status(''), 4000);
  }
  beginCalibration() {
    this.calibDismissed = false;
    const T = [[0.12, 0.12], [0.88, 0.12], [0.88, 0.88], [0.12, 0.88]];
    const el = document.getElementById('cal');
    el.querySelectorAll('.target').forEach(t => t.remove());
    const rings = T.map(([fx, fy]) => {
      const d = document.createElement('div');
      d.className = 'target';
      d.style.left = (fx * innerWidth) + 'px';
      d.style.top = (fy * innerHeight) + 'px';
      el.appendChild(d);
      return d;
    });
    el.classList.add('show');
    // Starts in 'release': if the button is already held when this opens,
    // corner 1 would otherwise capture wherever the can happened to be aimed.
    this.calib = { i: 0, T, rings, picked: [], streak: [], off: 0, phase: 'release' };
    this.calibUI();
  }
  calibUI(sub) {
    const c = this.calib;
    c.rings.forEach((r, i) => r.classList.toggle('on', i === c.i));
    document.getElementById('cal-msg').textContent = `Corner ${c.i + 1} of 4`;
    document.getElementById('cal-sub').textContent = sub !== undefined ? sub
      : c.phase === 'release' ? 'Release the button…'
      : 'Point at the ring and hold the button';
  }
  calibStep() {
    const c = this.calib;
    if (!c) return;                 // finished, or never started
    const NEED = 12;                // consecutive good frames per corner
    const GAP = 6;                  // frames with the LED off before one counts
    const SPREAD = 0.0075;          // normalised: how still the aim must be

    const spots = this.tracker.raw();
    const b = spots.length ? spots[0] : null;

    if (c.phase === 'release') {
      if (b) { c.off = 0; return; }
      if (++c.off >= GAP) { c.phase = 'aim'; c.streak = []; c.off = 0; this.calibUI(); }
      return;
    }

    if (!b) {
      if (c.streak.length) this.calibUI('Lost it — hold the button and keep still');
      c.streak = [];
      return;
    }
    // Compare against the mean of the streak so far, not the previous sample:
    // sample-to-sample drift is small even when the aim is sweeping, so the
    // looser test would average a moving aim into a confidently wrong corner.
    if (c.streak.length >= 3) {
      const mx = c.streak.reduce((a, p) => a + p[0], 0) / c.streak.length;
      const my = c.streak.reduce((a, p) => a + p[1], 0) / c.streak.length;
      if (Math.hypot(b.x - mx, b.y - my) > SPREAD) c.streak = [];
    }
    c.streak.push([b.x, b.y]);
    this.calibUI(`Hold… ${Math.min(NEED, c.streak.length)}/${NEED}`);
    if (c.streak.length < NEED) return;

    const n = c.streak.length;
    c.picked.push([c.streak.reduce((a, p) => a + p[0], 0) / n,
                   c.streak.reduce((a, p) => a + p[1], 0) / n]);
    c.streak = []; c.i++;
    if (c.i < 4) { c.phase = 'release'; c.off = 0; this.calibUI(); return; }

    const H = solveHomography(c.picked, c.T);
    document.getElementById('cal').classList.remove('show');
    this.calib = null;
    if (!H) { this.status('calibration failed — corners too close or in a line'); return; }
    this.tracker.homography = H;
    this.status('');
  }
}

const wall = new Wall();
window.wall = wall;

// tools/pi/kiosk.py and start-kiosk.sh drive the page through `app`, with the
// names the old wall used. Aliasing costs nothing and means one set of tools
// works against both pages rather than two that drift apart.
window.app = wall;
wall.piTracker = wall.tracker;
wall.setCamMode = () => {};                       // one mode here; harmless
wall.beginIRCalibration = () => wall.beginCalibration();
wall.clearCanvas = () => wall.clear();
wall.tracker.connect(`ws://${location.hostname || 'localhost'}:8765`);
</script>
